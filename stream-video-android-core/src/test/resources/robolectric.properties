# Robolectric 4.11.1's bundled Android framework maxes out at API 34, but the module now compiles
# against SDK 37 (Android 17), so tests without an explicit @Config would inherit targetSdk=37 and
# fail runner configuration ("targetSdkVersion=37 > maxSdkVersion=34").
# Pin the default test SDK to the module's minSdk (24), matching the pre-migration default: tests
# opt UP to a specific OS level via @Config (e.g. @Config(sdk=[UPSIDE_DOWN_CAKE])) and to Android 17
# behavior via ReflectionHelpers. Raise this default once Robolectric ships API 37 support.
sdk=24
