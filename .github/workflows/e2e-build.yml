name: E2E Build

on:
  workflow_call:

env:
  # The Gradle build cache comes from the Actions cache below instead of S3.
  GRADLE_LOCAL_BUILD_CACHE: 'true'

jobs:
  build:
    permissions:
      actions: write
      contents: read
    name: compose apks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/android-ci-actions/actions/setup-java@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - uses: GetStream/android-ci-actions/actions/enable-kvm@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - uses: GetStream/android-ci-actions/actions/setup-ruby@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      # Pull requests and the merge queue restore the latest cache; scheduled and manual runs save a new one.
      - name: Restore Gradle cache
        id: gradle_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-e2e-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gradle-e2e-
      - name: Build apks
        run: bundle exec fastlane build_e2e_test
        timeout-minutes: 30
      - name: Save Gradle cache
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle_cache.outputs.cache-primary-key }}
      - name: Upload apks
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            demo-app/build/outputs/apk/e2etesting/debug/*.apk
            demo-app/build/outputs/apk/androidTest/e2etesting/debug/*.apk
