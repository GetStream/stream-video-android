name: E2E Tests

on:
  pull_request:
  merge_group:
  # Also saves the Gradle cache that pull requests restore, so it comes from the latest merge.
  push:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'

  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level to run on'
        type: string
        required: false
        default: '36'
      test_class:
        description: 'Fully qualified test class to run on its own, optionally with #method. Every batch job then runs it, giving independent samples of a flaky test.'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A develop run finishes and saves the cache; only the newest pending push waits behind it.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PR_NUM: ${{ github.event.pull_request.number }}

jobs:
  build-compose-apks:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Build
    uses: ./.github/workflows/e2e-build.yml
    secrets: inherit
  allure_testops_launch:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Launch Allure TestOps
    runs-on: { group: github-public-amd64 }
    needs: build-compose-apks
    outputs:
      launch_id: ${{ env.LAUNCH_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: GetStream/android-ci-actions/actions/setup-ruby@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - uses: GetStream/android-ci-actions/actions/allure-launch@cb46e4f44d105a68738bfd2a1cfd156bb768665b
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          allure-token: ${{ secrets.ALLURE_TOKEN }}
  run-compose-tests:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    name: Test compose
    # A standard GitHub-hosted runner: the emulator needs its 4 cores, and the 2-core runners in
    # the static-IP group are too slow for the multi-participant tests. Nothing in this job calls
    # the GitHub API, which the org IP allow list only admits from static-IP runners.
    runs-on: ubuntu-24.04
    needs:
      - build-compose-apks
      - allure_testops_launch
    # The build job already asked the GitHub API whether this pull request touches the E2E sources.
    if: ${{ needs.build-compose-apks.outputs.built == 'true' }}
    strategy:
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
      fail-fast: false
    env:
      ANDROID_API_LEVEL: ${{ inputs.api_level || '34' }}
      LAUNCH_ID: ${{ needs.allure_testops_launch.outputs.launch_id }}
      # Without a PR number, fastlane neither re-checks the changed files nor looks up the branch
      # through the GitHub API; it reads the branch for the Allure upload from GIT_BRANCH instead.
      GITHUB_PR_NUM: ''
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: apks
      - uses: GetStream/android-ci-actions/actions/setup-java@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - uses: GetStream/android-ci-actions/actions/enable-kvm@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - uses: GetStream/android-ci-actions/actions/setup-ruby@cb46e4f44d105a68738bfd2a1cfd156bb768665b
      - name: Run tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        timeout-minutes: 45
        env:
          # Passed through the environment and expanded quoted, so the value cannot
          # inject shell commands into the script line; the Fastfile validates it too.
          TEST_CLASS: ${{ inputs.test_class }}
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          disable-animations: true
          profile: pixel
          arch : x86_64
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bundle exec fastlane run_e2e_test batch:${{ matrix.batch }} batch_count:${{ strategy.job-total }} test_class:"$TEST_CLASS"
      - name: Allure TestOps Upload
        if: ${{ env.LAUNCH_ID != '' && (success() || failure()) }}
        run: bundle exec fastlane allure_upload
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_ID: ${{ env.LAUNCH_ID }}
      - name: Allure TestOps Launch Removal
        if: ${{ env.LAUNCH_ID != '' && cancelled() }}
        run: bundle exec fastlane allure_launch_removal
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_ID: ${{ env.LAUNCH_ID }}
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        timeout-minutes: 10
        with:
          name: test_artifacts_${{ matrix.batch }}
          # The allure results carry the retry rule's failure artifacts (logcat,
          # screenshot, hierarchy per failed attempt), which TestOps deduplicates
          # away when the same test passes in another batch.
          path: |
            fastlane/recordings/*
            fastlane/allure-results/*
            fastlane/video-buddy-server.log
            fastlane/video-buddy-console.log
            fastlane/boot-logcat.txt
  # The single required check for E2E, so the shard count can change without touching branch
  # protection.
  e2e-result:
    name: E2E result
    runs-on: { group: github-public-amd64 }
    if: ${{ always() }}
    needs:
      - build-compose-apks
      - allure_testops_launch
      - run-compose-tests
    permissions: {}
    steps:
      - name: Fail if an E2E job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
