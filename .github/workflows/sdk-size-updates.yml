name: SDK size updates

on:
  push:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-sdk-sizes:
    permissions:
      contents: read
    uses: GetStream/stream-build-conventions-android/.github/workflows/sdk-size-updates.yml@543e0270bcdecc42343240aa419367d742978270 # GetStream/stream-build-conventions-android#97, replace with the release
    with:
      release-bot-app-id: ${{ vars.ANDROID_RELEASE_BOT_APP_ID }}
      modules: "stream-video-android-core stream-video-android-ui-xml stream-video-android-ui-compose"
      metrics-project: "stream-video-android-metrics"
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.ANDROID_RELEASE_BOT_PRIVATE_KEY }}
      BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
      BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
      BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
      BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}
