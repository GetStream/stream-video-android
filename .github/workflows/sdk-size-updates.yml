name: SDK size updates

on:
  push:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-sdk-sizes:
    permissions:
      contents: read
    uses: GetStream/stream-build-conventions-android/.github/workflows/sdk-size-updates.yml@500ef3b1a9a1823213f37cf269ef409042f7c7d2 # v1.2.0
    with:
      release-bot-client-id: ${{ vars.ANDROID_RELEASE_BOT_CLIENT_ID }}
      modules: "stream-video-android-core stream-video-android-ui-xml stream-video-android-ui-compose"
      metrics-project: "stream-video-android-metrics"
    secrets:
      release-bot-private-key: ${{ secrets.ANDROID_RELEASE_BOT_PRIVATE_KEY }}
      BUILD_CACHE_AWS_REGION: ${{ secrets.BUILD_CACHE_AWS_REGION }}
      BUILD_CACHE_AWS_BUCKET: ${{ secrets.BUILD_CACHE_AWS_BUCKET }}
      BUILD_CACHE_AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_AWS_ACCESS_KEY_ID }}
      BUILD_CACHE_AWS_SECRET_KEY: ${{ secrets.BUILD_CACHE_AWS_SECRET_KEY }}
