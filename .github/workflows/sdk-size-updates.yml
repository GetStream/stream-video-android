name: SDK size updates

on:
  push:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-sdk-sizes:
    permissions:
      contents: read
    uses: GetStream/stream-build-conventions-android/.github/workflows/sdk-size-updates.yml@178f8ddfa4c28ba19ba66c1c54f9091b00ef6c40 # v1.5.0
    with:
      release-bot-client-id: ${{ vars.ANDROID_RELEASE_BOT_CLIENT_ID }}
      modules: "stream-video-android-core stream-video-android-ui-xml stream-video-android-ui-compose"
      metrics-project: "stream-video-android-metrics"
    secrets:
      release-bot-private-key: ${{ secrets.ANDROID_RELEASE_BOT_PRIVATE_KEY }}
