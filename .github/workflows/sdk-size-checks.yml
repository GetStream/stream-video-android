name: SDK size checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-sdk-sizes:
    uses: GetStream/stream-build-conventions-android/.github/workflows/sdk-size-checks.yml@f1669c081bca009a0aa0978561096d32bfd156df # v1.4.0
    with:
      modules: "stream-video-android-core stream-video-android-ui-xml stream-video-android-ui-compose"
      metrics-project: "stream-video-android-metrics"
